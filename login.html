
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09141f">
  <title>BLY | Logga in</title>
  <link rel="stylesheet" href="/auth.css">
  <script src="/auth.js" defer></script>

  <style>
    .extra-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
      text-align: center;
    }

    .discord-button {
      display: block;
      padding: 13px 16px;
      background: #5865f2;
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s;
    }

    .discord-button:hover {
      background: #4752c4;
    }

    .buy-license {
      font-size: 14px;
      line-height: 1.6;
    }

    .buy-license a {
      color: #68b9ff;
      font-weight: 600;
      text-decoration: none;
    }

    .buy-license a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="auth-card">

    <div class="logo">BANKINATOR<span>.</span></div>

    <p class="subtitle">Välkommen till Bankinator</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">
        Logga in
      </button>

      <button id="registerTab" type="button">
        Skapa konto
      </button>
    </div>

    <h1 id="formTitle">Logga in</h1>

    <p class="description" id="formDescription">
      Logga in för att fortsätta till Bankinator.
    </p>

    <form id="authForm">

      <label for="email">E-postadress</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="namn@exempel.se"
        required>

      <label for="password">Lösenord</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Ange ditt lösenord"
        required>

      <div id="licenseGroup" hidden>
        <label for="licenseKey">Licensnyckel</label>

        <input
          id="licenseKey"
          type="text"
          placeholder="BLY-XXXX-XXXX-XXXX-XXXX"
          autocomplete="off"
          spellcheck="false">

        <p class="hint">
          En licensnyckel kan endast användas för att skapa ett konto.
        </p>
      </div>

      <p id="authError" role="alert"></p>

      <button id="submitButton" class="submit" type="submit">
        Logga in
      </button>

    </form>

    <div class="extra-links">
      <a
        class="discord-button"
        href="https://discord.gg/4cYnWuFY5"
        target="_blank"
        rel="noopener noreferrer">
        Join our Discord
      </a>

      <p class="buy-license">
        Don't have a license key?
        <a href="https://northstore.store">
          Buy one here!
        </a>
      </p>
    </div>

    <p class="footer">Bankinator · Kontosystem</p>

  </main>

</body>
</html>
